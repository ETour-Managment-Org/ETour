spring.application.name=ETourBackend
# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/etour_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root@120
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8081
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Google OAuth2 client (SSO)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# JWT
app.jwt.secret=${JWT_SECRET:c29tZXRoaW5nLXN1cGVyLXNlY3JldC1jaGFuZ2UtdGhpcy1pbi1wcm9kLTEyMzQ1Ng==}
app.jwt.expiration-ms=86400000

# Where the frontend lives, so we can redirect back with the token after Google login
app.oauth2.authorized-redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}