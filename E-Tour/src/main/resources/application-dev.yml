spring:
  datasource:
    url: jdbc:mysql://localhost:3306/etour_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update          # convenient locally, never in production
    show-sql: true              # lets you show the SQL live during a demo
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always              # reseed the demo data on every start

logging:
  level:
    com.etour: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"            # everything exposed locally
  endpoint:
    health:
      show-details: always      # full component breakdown, no auth needed

etour:
  images:
    dir: images
