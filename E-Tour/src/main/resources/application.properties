spring.application.name=E-Tour
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/etour_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

logging.level.com.example.demo=DEBUG

etour.jwt.secret=${JWT_SECRET:ZS1Ub3VyLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC1rZXktY2hhbmdlLWJlZm9yZS1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
etour.jwt.expiration-ms=86400000

etour.pricing.child-max-age=12

etour.cancellation.full-refund-days=7
etour.cancellation.partial-refund-days=3
etour.cancellation.full-refund-percent=100
etour.cancellation.partial-refund-percent=50
etour.cancellation.no-refund-percent=0

etour.images.dir=images
spring.web.resources.add-mappings=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
