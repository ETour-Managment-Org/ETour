upstream app_backend {
    server java-backend:8080;     
    #server dotnet-backend:5000;    
}

server {
    listen 80;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  5173;
    proxy_http_version 1.1;

    location ^~ /api/ {
        proxy_pass http://app_backend/api/;
    }

    location ^~ /images/ {
        proxy_pass http://app_backend/images/;
    }


    location ^~ /oauth2/ {
        proxy_pass http://app_backend/oauth2/;
    }

    location ^~ /login/oauth2/ {
        proxy_pass http://app_backend/login/oauth2/;
    }

    location ^~ /signin-google {
        proxy_pass http://app_backend/signin-google;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
